plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.cs3227'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ]
}

application {
    mainClass = 'com.company.incidentdesk.startup.IncidentDeskLauncher'
}

run {
    jvmArgs = ['--enable-native-access=javafx.graphics']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
    if (providers.gradleProperty('mediaDiagnostics').isPresent()) {
        // Test fixtures use temporary storage; never enable URI tracing in production.
        systemProperty 'jfxmedia.loglevel', 'DEBUG'
        testLogging.showStandardStreams = true
    }
}

tasks.register('previewAuthenticatedShell', JavaExec) {
    group = 'application'
    description = 'Launches the test-only administrator login and authenticated-shell preview.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.company.incidentdesk.ui.navigation.AuthenticatedShellPreview'
    jvmArgs = ['--enable-native-access=javafx.graphics']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

// The distribution tasks create archives for local testing.
// Native .msi, .dmg, and .deb installers can be added later with jpackage.
