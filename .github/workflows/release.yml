name: Package local application

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    name: Package on ${{ matrix.os }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
            artifact: incident-desk.jar
            publish: true
          - os: windows-latest
            architecture: x64
            publish: false
          - os: macos-latest
            architecture: x64
            publish: false
          - os: macos-latest
            architecture: arm64
            artifact: incident-desk-mac-aarch64.jar
            publish: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # Test Intel macOS under Rosetta and Apple Silicon natively.
          architecture: ${{ matrix.architecture }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project configuration
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew was not found. Add the Gradle Wrapper before creating a release."
            exit 1
          fi

      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          chmod +x gradlew

      - name: Build and test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum ./gradlew build

      - name: Build and test
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew build

      - name: Package application
        shell: bash
        run: ./gradlew build -x test

      - name: Upload packaged application
        if: matrix.publish
        uses: actions/upload-artifact@v4
        with:
          name: incident-app-${{ matrix.os }}-${{ matrix.architecture }}
          # Publish each filename once; other jobs verify the same Intel artifact.
          path: build/libs/${{ matrix.artifact }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: incident-app-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
