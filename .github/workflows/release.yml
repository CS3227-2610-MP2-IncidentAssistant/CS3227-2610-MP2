name: Package local application

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # The packaged JavaFX natives are x86_64-only (see build.gradle).
          # macos-latest is an arm64 runner; forcing an x64 JDK here runs it
          # under GitHub's preinstalled Rosetta 2, so the x86_64 JavaFX
          # Toolkit natives load correctly. GitHub no longer provisions
          # Intel (macos-13) hosted runners, so Rosetta is used instead of
          # pinning to an Intel runner image. This also makes the resolved
          # `implementation` classifier (win/mac/linux, all x86_64) match
          # what actually runs on every job in this matrix.
          architecture: x64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project configuration
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew was not found. Add the Gradle Wrapper before creating a release."
            exit 1
          fi

      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          chmod +x gradlew

      - name: Build and test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum ./gradlew build

      - name: Build and test
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew build

      - name: Package application
        shell: bash
        run: ./gradlew build -x test

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: incident-app-${{ matrix.os }}
          path: |
            build/libs/*
            build/distributions/*
            build/jpackage/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: incident-app-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
