name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project configuration
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew was not found. Add the Gradle Wrapper before enabling CI."
            exit 1
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build
        run: xvfb-run --auto-servernum ./gradlew build
