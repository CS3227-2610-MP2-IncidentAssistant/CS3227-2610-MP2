name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project configuration
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew was not found. Add the Gradle Wrapper before enabling CI."
            exit 1
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run tests and build
        run: xvfb-run --auto-servernum ./gradlew build

      - name: Preserve Linux test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          retention-days: 7

  attachment-platform-tests:
    name: Attachments (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is the last Intel macOS runner. The packaged JavaFX
        # natives are x86_64-only (see build.gradle); an arm64 runner like
        # macos-latest cannot load them and JavaFX Toolkit startup fails.
        os: [windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify image attachments and storage
        shell: bash
        run: ./gradlew test --tests '*Attachment*Test'

      - name: Preserve attachment test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          retention-days: 7
